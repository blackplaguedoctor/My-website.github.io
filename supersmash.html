<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMASH BROS // CUSTOM FIGHTER EDITION</title>
    <style>
        :root {
            --bg-dark: #080b10;
            --bg-card: #121721;
            --accent-blue: #00f0ff;
            --accent-red: #ff2a5f;
            --text-main: #f0f6fc;
            --border-color: #232b38;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 16px;
            max-width: 860px;
            width: 100%;
        }

        h1 {
            font-size: 1.4rem;
            color: var(--accent-blue);
            letter-spacing: 1px;
            width: 100%;
        }

        .menu-screen {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            padding: 20px;
        }

        .selectors-grid {
            display: flex;
            justify-content: space-around;
            gap: 20px;
        }

        .player-setup {
            background: #1a2230;
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 320px;
        }

        .player-setup h3 {
            font-size: 1.1rem;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
            font-size: 0.9rem;
            color: #8b949e;
        }

        select, input[type="color"] {
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            background: #080b10;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            outline: none;
            cursor: pointer;
        }

        input[type="color"] {
            height: 40px;
            padding: 2px;
        }

        .btn-start {
            background: var(--accent-blue);
            color: #080b10;
            border: none;
            padding: 12px 24px;
            font-weight: bold;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 10px;
        }

        .btn-start:hover {
            opacity: 0.85;
        }

        .game-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            width: 100%;
        }

        .hud {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 800px;
            font-weight: 800;
            font-size: 1.1rem;
            padding: 0 10px;
        }

        .p1-hud { color: var(--accent-blue); }
        .p2-hud { color: var(--accent-red); }

        canvas {
            background: linear-gradient(135deg, #111827, #1f2937);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: block;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 800px;
            height: auto;
        }

        .controls-info {
            font-size: 0.85rem;
            color: #8b949e;
            display: flex;
            justify-content: center;
            gap: 30px;
            width: 100%;
        }

        .controls-info span {
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="menuScreen" class="menu-screen">
            <h1>CHOOSE YOUR FIGHTER & CUSTOMIZE</h1>
            <div class="selectors-grid">
                <div class="player-setup" style="border-top: 4px solid var(--accent-blue);">
                    <h3 style="color: var(--accent-blue);">PLAYER 1 CONFIG</h3>
                    <div class="control-group">
                        <label>Fighter Class:</label>
                        <select id="p1Class">
                            <option value="balanced">Balanced (All-Rounder)</option>
                            <option value="speedster">Speedster (Fast & Agile)</option>
                            <option value="tank">Heavy Tank (High Power)</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label>Color Theme:</label>
                        <input type="color" id="p1Color" value="#00f0ff">
                    </div>
                </div>

                <div class="player-setup" style="border-top: 4px solid var(--accent-red);">
                    <h3 style="color: var(--accent-red);">PLAYER 2 CONFIG</h3>
                    <div class="control-group">
                        <label>Fighter Class:</label>
                        <select id="p2Class">
                            <option value="balanced">Balanced (All-Rounder)</option>
                            <option value="speedster">Speedster (Fast & Agile)</option>
                            <option value="tank">Heavy Tank (High Power)</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label>Color Theme:</label>
                        <input type="color" id="p2Color" value="#ff2a5f">
                    </div>
                </div>
            </div>
            <button class="btn-start" onclick="startGame()">START MATCH</button>
        </div>

        <div id="gameScreen" class="game-screen">
            <h1>SMASH MINI FIGHTER</h1>
            
            <div class="hud">
                <div class="p1-hud">PLAYER 1: <span id="p1Stocks">3</span> Stocks | <span id="p1Damage">0</span>%</div>
                <div class="p2-hud">PLAYER 2: <span id="p2Stocks">3</span> Stocks | <span id="p2Damage">0</span>%</div>
            </div>

            <canvas id="gameCanvas" width="800" height="450"></canvas>

            <div class="controls-info">
                <div><strong>P1:</strong> Move: <span>A / D</span> | Jump: <span>W</span> | Attack: <span>F</span></div>
                <div><strong>P2:</strong> Move: <span>Left / Right</span> | Jump: <span>Up</span> | Attack: <span>L</span></div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const keys = {};
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        const gravity = 0.5;
        const friction = 0.85;

        class Fighter {
            constructor(x, y, color, fighterClass, controls) {
                this.x = x;
                this.y = y;
                this.vx = 0; // Fixed: Initialized velocity X
                this.vy = 0; // Fixed: Initialized velocity Y
                this.color = color;
                this.controls = controls;
                this.stocks = 3;
                this.damage = 0;
                this.facing = 1;
                this.isAttacking = false;
                this.attackCooldown = 0;

                this.applyClassStats(fighterClass);
            }

            applyClassStats(type) {
                switch(type) {
                    case 'speedster':
                        this.width = 25;
                        this.height = 45;
                        this.speed = 6;
                        this.jumpPower = -12.5;
                        this.attackPower = 5;
                        this.weight = 0.85;
                        break;
                    case 'tank':
                        this.width = 38;
                        this.height = 56;
                        this.speed = 3;
                        this.jumpPower = -9.5;
                        this.attackPower = 12;
                        this.weight = 1.3;
                        break;
                    default:
                        this.width = 30;
                        this.height = 50;
                        this.speed = 4;
                        this.jumpPower = -11;
                        this.attackPower = 7;
                        this.weight = 1.0;
                        break;
                }
            }

            update(platforms) {
                if (keys[this.controls.left]) {
                    this.vx = -this.speed;
                    this.facing = -1;
                } else if (keys[this.controls.right]) {
                    this.vx = this.speed;
                    this.facing = 1;
                } else {
                    this.vx *= friction;
                }

                if (keys[this.controls.up] && this.grounded) {
                    this.vy = this.jumpPower;
                    this.grounded = false;
                }

                if (keys[this.controls.attack] && this.attackCooldown === 0) {
                    this.isAttacking = true;
                    this.attackCooldown = 25;
                }

                if (this.attackCooldown > 0) {
                    this.attackCooldown--;
                    if (this.attackCooldown < 15) {
                        this.isAttacking = false;
                    }
                }

                this.vy += gravity;
                this.x += this.vx;
                this.y += this.vy;

                this.grounded = false;
                platforms.forEach(plat => {
                    if (
                        this.x < plat.x + plat.width &&
                        this.x + this.width > plat.x &&
                        this.y + this.height >= plat.y &&
                        this.y + this.height - this.vy <= plat.y + 10 &&
                        this.vy >= 0
                    ) {
                        this.y = plat.y - this.height;
                        this.vy = 0;
                        this.grounded = true;
                    }
                });

                if (this.x < -100 || this.x > canvas.width + 100 || this.y > canvas.height + 100 || this.y < -200) {
                    this.respawn();
                }
            }

            respawn() {
                this.stocks--;
                this.damage = 0;
                this.x = canvas.width / 2 + (this.vx > 0 ? -100 : 100);
                this.y = 100;
                this.vx = 0;
                this.vy = 0;
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.width, this.height);

                ctx.fillStyle = '#ffffff';
                let eyeX = this.facing === 1 ? this.x + this.width - 10 : this.x + 4;
                ctx.fillRect(eyeX, this.y + 10, 6, 6);

                if (this.isAttacking) {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                    let hitX = this.facing === 1 ? this.x + this.width : this.x - 30;
                    ctx.fillRect(hitX, this.y + 10, 30, 25);
                }
            }

            getHitbox() {
                return { x: this.x, y: this.y, width: this.width, height: this.height };
            }

            getAttackHitbox() {
                if (!this.isAttacking) return null;
                let hitX = this.facing === 1 ? this.x + this.width : this.x - 30;
                return { x: hitX, y: this.y + 10, width: 30, height: 25 };
            }
        }

        const platforms = [
            { x: 150, y: 340, width: 500, height: 20 },
            { x: 220, y: 230, width: 140, height: 15 },
            { x: 440, y: 230, width: 140, height: 15 }
        ];

        let p1, p2;

        function startGame() {
            const p1Class = document.getElementById('p1Class').value;
            const p2Class = document.getElementById('p2Class').value;
            const p1Color = document.getElementById('p1Color').value;
            const p2Color = document.getElementById('p2Color').value;

            p1 = new Fighter(200, 200, p1Color, p1Class, { left: 'KeyA', right: 'KeyD', up: 'KeyW', attack: 'KeyF' });
            p2 = new Fighter(560, 200, p2Color, p2Class, { left: 'ArrowLeft', right: 'ArrowRight', up: 'ArrowUp', attack: 'KeyL' });

            document.getElementById('menuScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'flex';

            requestAnimationFrame(gameLoop);
        }

        function checkCollisions() {
            const p1Attack = p1.getAttackHitbox();
            const p2Attack = p2.getAttackHitbox();
            const p1Box = p1.getHitbox();
            const p2Box = p2.getHitbox();

            if (p1Attack && rectIntersect(p1Attack, p2Box)) {
                p2.damage += p1.attackPower;
                let knockback = (4 + (p2.damage * 0.15)) / p2.weight;
                p2.vx = p1.facing * knockback;
                p2.vy = -knockback * 0.7;
                p1.isAttacking = false;
            }

            if (p2Attack && rectIntersect(p2Attack, p1Box)) {
                p1.damage += p2.attackPower;
                let knockback = (4 + (p1.damage * 0.15)) / p1.weight;
                p1.vx = p2.facing * knockback;
                p1.vy = -knockback * 0.7;
                p2.isAttacking = false;
            }
        }

        function rectIntersect(r1, r2) {
            return r1.x < r2.x + r2.width &&
                   r1.x + r1.width > r2.x &&
                   r1.y < r2.y + r2.height &&
                   r1.y + r1.height > r2.y;
        }

        function updateHUD() {
            document.getElementById('p1Stocks').textContent = p1.stocks;
            document.getElementById('p1Damage').textContent = Math.floor(p1.damage);
            document.getElementById('p2Stocks').textContent = p2.stocks;
            document.getElementById('p2Damage').textContent = Math.floor(p2.damage);
        }

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            p1.update(platforms);
            p2.update(platforms);

            checkCollisions();

            ctx.fillStyle = '#232b38';
            platforms.forEach(plat => {
                ctx.fillRect(plat.x, plat.y, plat.width, plat.height);
                ctx.strokeStyle = '#00f0ff';
                ctx.strokeRect(plat.x, plat.y, plat.width, plat.height);
            });

            p1.draw();
            p2.draw();

            updateHUD();

            if (p1.stocks <= 0 || p2.stocks <= 0) {
                ctx.fillStyle = 'rgba(8, 11, 16, 0.85)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#f0f6fc';
                ctx.font = 'bold 30px sans-serif';
                ctx.textAlign = 'center';
                let winner = p1.stocks <= 0 ? "PLAYER 2 WINS!" : "PLAYER 1 WINS!";
                ctx.fillText(winner, canvas.width / 2, canvas.height / 2);
                return;
            }

            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
