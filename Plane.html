<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky High Ace - Flight Simulator</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
            user-select: none;
        }

        #menu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10, 20, 40, 0.95);
            color: #fff;
            padding: 35px 40px;
            border-radius: 14px;
            border: 4px solid #00bbff;
            text-align: center;
            z-index: 100;
            box-shadow: 0 0 35px rgba(0, 187, 255, 0.5);
            min-width: 320px;
        }

        #menu h1 {
            margin-top: 0;
            color: #00bbff;
            font-size: 32px;
            text-shadow: 2px 2px #000;
        }

        .option-group {
            margin: 15px 0;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #88eeff;
            font-size: 14px;
        }

        select {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border-radius: 6px;
            border: 2px solid #00bbff;
            background: #112233;
            color: #fff;
            cursor: pointer;
        }

        button {
            margin-top: 20px;
            width: 100%;
            padding: 14px;
            font-size: 20px;
            font-weight: bold;
            background: #00bbff;
            color: #000;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 0 #0077aa;
        }

        button:hover {
            background: #33ccff;
        }

        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
            z-index: 10;
            display: none;
            background: rgba(0,0,0,0.4);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        #controls-hint {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            background: rgba(0, 0, 0, 0.75);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.3);
            z-index: 10;
            display: none;
        }
    </style>
</head>
<body>

    <div id="menu">
        <h1>SKY HIGH ACE</h1>
        
        <div class="option-group">
            <label for="modeSelect">Game Mode:</label>
            <select id="modeSelect">
                <option value="rush">Ring Rush (Timed Challenge)</option>
                <option value="free">Free Flight (Exploration)</option>
            </select>
        </div>

        <div class="option-group">
            <label for="planeSelect">Select Aircraft:</label>
            <select id="planeSelect">
                <option value="fighter">Fighter Jet (Fast & Responsive)</option>
                <option value="biplane">Stunt Biplane (Agile & Light)</option>
                <option value="bomber">Heavy Bomber (Stable & Smooth)</option>
            </select>
        </div>

        <button id="startBtn">START FLIGHT</button>
    </div>

    <div id="hud">
        Score: <span id="score">0</span> | 
        Altitude: <span id="altitude">100</span>m | 
        Speed: <span id="speedDisplay">100</span>% 
        <div id="timerContainer" style="margin-top: 5px;">Time Left: <span id="timer">60</span>s</div>
    </div>

    <div id="controls-hint">
        <strong>W / S:</strong> Pitch Down/Up | <strong>A / D:</strong> Turn / Roll | <strong>E / Q:</strong> Throttle Up/Down
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer;
        let airplane;
        let rings = [];
        let score = 0;
        let gameActive = false;
        let gameMode = 'rush';
        let timeLeft = 60;
        let timerInterval;

        // Flight States
        let planeConfig = {
            speed: 1.0,
            maxSpeed: 2.6,
            minSpeed: 0.4,
            accel: 0.025,
            pitchRate: 0.02,
            rollRate: 0.04
        };

        let speed = 1.0;
        let pitch = 0;
        let roll = 0;
        let yaw = 0;

        const keys = {};

        const planePresets = {
            fighter: { speed: 1.2, maxSpeed: 2.8, minSpeed: 0.5, accel: 0.03, pitchRate: 0.022, rollRate: 0.045 },
            biplane: { speed: 0.9, maxSpeed: 2.0, minSpeed: 0.3, accel: 0.025, pitchRate: 0.028, rollRate: 0.055 },
            bomber: { speed: 0.8, maxSpeed: 1.6, minSpeed: 0.4, accel: 0.015, pitchRate: 0.014, rollRate: 0.025 }
        };

        document.getElementById('startBtn').addEventListener('click', () => {
            gameMode = document.getElementById('modeSelect').value;
            const planeKey = document.getElementById('planeSelect').value;
            planeConfig = planePresets[planeKey];
            speed = planeConfig.speed;

            document.getElementById('menu').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            document.getElementById('controls-hint').style.display = 'block';

            if (gameMode === 'free') {
                document.getElementById('timerContainer').style.display = 'none';
            } else {
                startTimer();
            }

            gameActive = true;
        });

        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);
            scene.fog = new THREE.FogExp2(0x87ceeb, 0.0012);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 4000);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Lighting
            const ambient = new THREE.AmbientLight(0xffffff, 0.75);
            scene.add(ambient);

            const sun = new THREE.DirectionalLight(0xffffff, 0.9);
            sun.position.set(200, 400, 200);
            scene.add(sun);

            // Terrain Ground
            const groundGeo = new THREE.PlaneGeometry(6000, 6000, 50, 50);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x2e8b57, roughness: 0.9 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -15;
            scene.add(ground);

            createAirplane();
            spawnRings();
        }

        function createAirplane() {
            airplane = new THREE.Group();

            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xcc2222, roughness: 0.3 });
            const fuselage = new THREE.Mesh(new THREE.ConeGeometry(0.8, 5, 8), bodyMat);
            fuselage.rotation.x = Math.PI / 2;
            airplane.add(fuselage);

            const wingMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
            const wings = new THREE.Mesh(new THREE.BoxGeometry(8, 0.15, 1.6), wingMat);
            wings.position.set(0, 0, 0.2);
            airplane.add(wings);

            const tail = new THREE.Mesh(new THREE.BoxGeometry(0.15, 1.4, 1.2), wingMat);
            tail.position.set(0, 0.7, -2.1);
            airplane.add(tail);

            airplane.position.set(0, 120, 0);
            scene.add(airplane);
        }

        function spawnRings() {
            const ringGeo = new THREE.TorusGeometry(7, 0.7, 8, 24);
            const ringMat = new THREE.MeshStandardMaterial({ color: 0xffd700, emissive: 0x443300 });

            for (let i = 0; i < 20; i++) {
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.position.set(
                    (Math.random() - 0.5) * 1200,
                    60 + Math.random() * 200,
                    -i * 140 - 120
                );
                scene.add(ring);
                rings.push(ring);
            }
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    gameActive = false;
                    alert(`TIME'S UP! Final Score: ${score}`);
                    location.reload();
                }
            }, 1000);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (gameActive) {
                // Throttle control (E / Q)
                if (keys['e']) speed = Math.min(speed + planeConfig.accel, planeConfig.maxSpeed);
                if (keys['q']) speed = Math.max(speed - planeConfig.accel, planeConfig.minSpeed);

                // Pitch & Roll controls
                if (keys['w']) pitch += planeConfig.pitchRate;
                if (keys['s']) pitch -= planeConfig.pitchRate;
                if (keys['a']) roll += planeConfig.rollRate;
                if (keys['d']) roll -= planeConfig.rollRate;

                // Natural stability damping
                roll *= 0.95;
                pitch *= 0.96;

                // Corrected Banking turns: Roll left (positive roll) turns left (positive yaw change)
                yaw += roll * 0.025 * (speed / planeConfig.maxSpeed);

                // Apply rotations in correct order (Yaw -> Pitch -> Roll)
                airplane.rotation.set(0, 0, 0, 'YXZ');
                airplane.rotation.y = yaw;
                airplane.rotation.x = pitch;
                airplane.rotation.z = roll;

                // Move forward based on orientation
                airplane.translateZ(-speed);

                // Smooth third-person camera follow
                const camOffset = new THREE.Vector3(0, 4.5, 14).applyQuaternion(airplane.quaternion);
                camera.position.copy(airplane.position).add(camOffset);
                camera.lookAt(airplane.position.clone().add(new THREE.Vector3(0, 0, -12).applyQuaternion(airplane.quaternion)));

                // Update HUD info
                document.getElementById('altitude').innerText = Math.round(airplane.position.y);
                document.getElementById('speedDisplay').innerText = Math.round((speed / planeConfig.maxSpeed) * 100);

                // Ring collection check
                rings.forEach((ring, index) => {
                    if (airplane.position.distanceTo(ring.position) < 9) {
                        scene.remove(ring);
                        rings.splice(index, 1);
                        score += 150;
                        document.getElementById('score').innerText = score;

                        // Spawn next ring ahead
                        const newRing = ring.clone();
                        newRing.position.set(
                            (Math.random() - 0.5) * 1200,
                            60 + Math.random() * 200,
                            airplane.position.z - 1400 - Math.random() * 200
                        );
                        scene.add(newRing);
                        rings.push(newRing);
                    }
                });

                // Ground crash detection
                if (airplane.position.y < -15) {
                    gameActive = false;
                    alert(`CRASH! You hit the ground. Final Score: ${score}`);
                    location.reload();
                }
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
