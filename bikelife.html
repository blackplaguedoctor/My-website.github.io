<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wheelie Life - Mega Arcade Edition</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #0b0c10;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            user-select: none;
        }

        #game-container {
            text-align: center;
            position: relative;
        }

        #menu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 23, 42, 0.96);
            padding: 30px;
            border: 3px solid #00f0ff;
            border-radius: 16px;
            z-index: 20;
            box-shadow: 0 0 35px rgba(0, 240, 255, 0.35);
            width: 380px;
        }

        #menu h1 {
            margin: 0 0 15px 0;
            color: #00f0ff;
            font-size: 30px;
            text-shadow: 0 0 12px rgba(0, 240, 255, 0.6);
            letter-spacing: 2px;
        }

        .option-group {
            margin: 15px 0;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #7000ff;
            font-size: 14px;
            text-transform: uppercase;
        }

        select {
            width: 100%;
            padding: 10px;
            font-size: 15px;
            border-radius: 8px;
            border: 2px solid #7000ff;
            background: #1e1b4b;
            color: #fff;
            cursor: pointer;
            outline: none;
        }

        canvas {
            background: linear-gradient(to bottom, #0f172a, #1e293b);
            border: 4px solid #00f0ff;
            border-radius: 14px;
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.2);
            display: block;
        }

        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 14px;
            font-weight: bold;
            pointer-events: none;
            display: none;
            background: rgba(15, 23, 42, 0.88);
            padding: 12px 20px;
            border-radius: 10px;
            border: 1px solid rgba(0, 240, 255, 0.3);
            text-align: left;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .balance-container {
            margin-top: 8px;
            width: 200px;
            height: 10px;
            background: #334155;
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid #64748b;
        }

        #balance-bar {
            height: 100%;
            width: 0%;
            background: #00ff66;
            transition: width 0.1s linear, background-color 0.2s ease;
        }

        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 23, 42, 0.96);
            padding: 35px;
            border: 3px solid #ff0055;
            border-radius: 16px;
            display: none;
            box-shadow: 0 0 35px rgba(255, 0, 85, 0.4);
            text-align: center;
            z-index: 15;
            width: 320px;
        }

        #game-over h2 {
            margin: 0 0 10px 0;
            color: #ff0055;
            font-size: 32px;
            text-shadow: 0 0 10px rgba(255, 0, 85, 0.5);
        }

        button {
            margin-top: 15px;
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            background: #00f0ff;
            color: #0f172a;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 0 #00b8d4;
            transition: all 0.1s ease;
        }

        button:hover {
            background: #7000ff;
            color: #fff;
            box-shadow: 0 4px 0 #4c00b3;
        }

        #controls-hint {
            margin-top: 10px;
            font-size: 12px;
            color: #94a3b8;
            display: none;
            max-width: 850px;
            line-height: 1.6;
        }

        .key {
            background: #334155;
            padding: 2px 6px;
            border-radius: 4px;
            color: #fff;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="menu">
            <h1>WHEELIE LIFE</h1>
            <div class="option-group">
                <label for="bikeSelect">Select Bike Garage:</label>
                <select id="bikeSelect">
                    <option value="scooter">Moped / Scooter (Easy Balance)</option>
                    <option value="pitbike">Mini Pit Bike (Twitchy & Agile)</option>
                    <option value="dirtbike" selected>Dirt Bike (Balanced Stunts)</option>
                    <option value="supermoto">Supermoto (Wide Balance Zone)</option>
                    <option value="sportbike">Sport Bike (High Speed Torque)</option>
                    <option value="cruiser">V-Twin Cruiser (Heavy Scraping Machine)</option>
                    <option value="hyperbike">Electric Hyperbike (Extreme Speed)</option>
                </select>
            </div>
            <button id="startBtn">START RIDE</button>
        </div>

        <div id="hud">
            Score: <span id="score" style="color: #00f0ff;">0</span> | Best: <span id="highScore" style="color: #ffaa00;">0</span><br>
            Speed: <span id="speedDisplay">0</span> km/h | Stunt Multiplier: <span id="comboDisplay" style="color: #00ff66;">1x</span><br>
            Active Trick: <span id="trickDisplay" style="color: #ff0055; font-weight: bold;">NONE</span>
            <div class="balance-container">
                <div id="balance-bar"></div>
            </div>
        </div>

        <canvas id="gameCanvas" width="850" height="480"></canvas>
        <div id="controls-hint">
            <span class="key">A</span>/<span class="key">D</span> Lean | 
            <span class="key">W</span> Throttle | 
            <span class="key">Space</span> Brake | 
            <span class="key">1</span> One-Hand | 
            <span class="key">2</span> No-Foot | 
            <span class="key">3</span> Nac-Nac | 
            <span class="key">4</span> Superman | 
            <span class="key">5</span> Coffin | 
            <span class="key">6</span> High Chair
        </div>
        
        <div id="game-over">
            <h2>CRASHED!</h2>
            <p>Final Score: <span id="finalScore">0</span></p>
            <button onclick="restartGame()">TRY AGAIN</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let score = 0;
        let highScore = 0;
        let gameActive = false;
        let distance = 0;
        let sceneryOffset = 0;
        let activeTrickName = "NONE";

        const keys = {};
        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            if (['Space', 'ArrowUp', 'ArrowDown', 'Digit1', 'Digit2', 'Digit3', 'Digit4', 'Digit5', 'Digit6'].includes(e.code)) {
                e.preventDefault();
            }
        });
        window.addEventListener('keyup', e => keys[e.code] = false);
        window.addEventListener('blur', () => { for (let k in keys) keys[k] = false; });

        // Expanded Garage Specifications & Dynamic Physics Parameters
        const bikeConfigs = {
            scooter: { 
                maxSpeed: 9, accel: 0.08, leanPower: 0.003, brakePower: 0.025, 
                gravityTorque: 0.0022, sweetSpotMin: 0.4, sweetSpotMax: 1.0,
                color: '#ff0055', accent: '#ffffff', scrapeAngle: 1.35, crashAngle: 1.58 
            },
            pitbike: { 
                maxSpeed: 10, accel: 0.12, leanPower: 0.006, brakePower: 0.04, 
                gravityTorque: 0.0035, sweetSpotMin: 0.4, sweetSpotMax: 1.1,
                color: '#00ff66', accent: '#111111', scrapeAngle: 1.38, crashAngle: 1.62 
            },
            dirtbike: { 
                maxSpeed: 12, accel: 0.1, leanPower: 0.004, brakePower: 0.03, 
                gravityTorque: 0.0028, sweetSpotMin: 0.45, sweetSpotMax: 1.15,
                color: '#ffaa00', accent: '#111111', scrapeAngle: 1.38, crashAngle: 1.60 
            },
            supermoto: { 
                maxSpeed: 13, accel: 0.11, leanPower: 0.0042, brakePower: 0.032, 
                gravityTorque: 0.0025, sweetSpotMin: 0.4, sweetSpotMax: 1.25,
                color: '#7000ff', accent: '#00f0ff', scrapeAngle: 1.40, crashAngle: 1.65 
            },
            sportbike: { 
                maxSpeed: 15, accel: 0.13, leanPower: 0.0048, brakePower: 0.035, 
                gravityTorque: 0.0034, sweetSpotMin: 0.5, sweetSpotMax: 1.2,
                color: '#00f0ff', accent: '#7000ff', scrapeAngle: 1.42, crashAngle: 1.60 
            },
            cruiser: { 
                maxSpeed: 11, accel: 0.07, leanPower: 0.0028, brakePower: 0.022, 
                gravityTorque: 0.0020, sweetSpotMin: 0.35, sweetSpotMax: 1.3,
                color: '#e11d48', accent: '#cbd5e1', scrapeAngle: 1.30, crashAngle: 1.68 
            },
            hyperbike: { 
                maxSpeed: 18, accel: 0.16, leanPower: 0.0055, brakePower: 0.04, 
                gravityTorque: 0.0038, sweetSpotMin: 0.5, sweetSpotMax: 1.25,
                color: '#eab308', accent: '#0f172a', scrapeAngle: 1.40, crashAngle: 1.62 
            }
        };

        let currentConfig = bikeConfigs.dirtbike;

        // Bike State
        const bike = {
            rearX: 220,
            rearY: 380,
            angle: 0, 
            angularVelocity: 0,
            speed: 0,
            wheelRadius: 20,
            wheelRotation: 0,
            frontWheelRotation: 0,
            frameLength: 65
        };

        let particles = [];

        document.getElementById('startBtn').addEventListener('click', () => {
            const bikeKey = document.getElementById('bikeSelect').value;
            currentConfig = bikeConfigs[bikeKey];
            resetBikeState();

            document.getElementById('menu').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            document.getElementById('controls-hint').style.display = 'block';
            gameActive = true;
        });

        function resetBikeState() {
            bike.speed = 3;
            bike.angle = 0;
            bike.angularVelocity = 0;
            bike.wheelRotation = 0;
            bike.frontWheelRotation = 0;
            score = 0;
            distance = 0;
            sceneryOffset = 0;
            particles = [];
            activeTrickName = "NONE";
        }

        function update() {
            if (!gameActive) return;

            // 1. Throttle Logic
            const isThrottling = keys['ArrowUp'] || keys['KeyW'];
            if (isThrottling) {
                bike.speed = Math.min(bike.speed + currentConfig.accel, currentConfig.maxSpeed);
                bike.angularVelocity += (bike.speed / currentConfig.maxSpeed) * 0.0018;
            } else {
                bike.speed = Math.max(bike.speed - 0.04, 2);
            }

            // 2. Lean Controls
            if (keys['ArrowLeft'] || keys['KeyA']) bike.angularVelocity += currentConfig.leanPower;
            if (keys['ArrowRight'] || keys['KeyD']) bike.angularVelocity -= currentConfig.leanPower;

            // 3. Rear Brake Mechanic
            if (keys['Space'] || keys['KeyS'] || keys['ArrowDown']) {
                bike.angularVelocity -= currentConfig.brakePower;
                bike.speed *= 0.98;
            }

            // 4. Gravity & Natural Weight Physics
            if (bike.angle > 0) {
                let gravityFactor = Math.cos(bike.angle - 0.7); 
                bike.angularVelocity -= currentConfig.gravityTorque * (1.1 - gravityFactor);
            }

            // Damping
            bike.angularVelocity *= 0.96;
            bike.angle += bike.angularVelocity;

            // 5. Ground Contact & Extended Crash Detection ("Kill Zone" pushed farther back)
            if (bike.angle <= 0) {
                bike.angle = 0;
                bike.angularVelocity = 0;
            }

            // CRASH CONDITION: Customized per motorcycle (up to ~96 degrees / 1.68 rads)
            if (bike.angle > currentConfig.crashAngle) {
                gameOver();
                return;
            }

            // 6. EXPANDED TRICK SYSTEM
            activeTrickName = "NONE";
            let trickMultiplier = 1;

            if (bike.angle > 0.2) {
                if (keys['Digit1'] || keys['KeyZ']) {
                    activeTrickName = "ONE-HANDER";
                    trickMultiplier = 2.0;
                } else if (keys['Digit2'] || keys['KeyX']) {
                    activeTrickName = "NO-FOOT";
                    trickMultiplier = 3.0;
                } else if (keys['Digit3'] || keys['KeyC']) {
                    activeTrickName = "NAC-NAC";
                    trickMultiplier = 4.0;
                } else if (keys['Digit4'] || keys['KeyV']) {
                    activeTrickName = "SUPERMAN!";
                    trickMultiplier = 5.0;
                    bike.angularVelocity += 0.0004; // Balance penalty for extreme tricks
                } else if (keys['Digit5'] || keys['KeyB']) {
                    activeTrickName = "COFFIN LAYBACK";
                    trickMultiplier = 6.0;
                    bike.angularVelocity += 0.0006;
                } else if (keys['Digit6'] || keys['KeyN']) {
                    activeTrickName = "HIGH CHAIR";
                    trickMultiplier = 7.0;
                    bike.angularVelocity -= 0.0005;
                }

                // TAIL SCRAPE (Automatic when pushing past fender angle without crashing!)
                if (bike.angle >= currentConfig.scrapeAngle && bike.angle <= currentConfig.crashAngle) {
                    activeTrickName = "TAIL SCRAPE!! 🔥";
                    trickMultiplier = 8.0;

                    // Fender friction slightly pulls front back down to allow infinite scraping!
                    bike.angularVelocity -= 0.0007;

                    // Spark particle storm
                    for (let i = 0; i < 4; i++) {
                        particles.push({
                            x: bike.rearX - 22,
                            y: bike.rearY + bike.wheelRadius - 3,
                            vx: -bike.speed * 0.9 - Math.random() * 5,
                            vy: (Math.random() - 0.6) * 4,
                            radius: Math.random() * 3.5 + 1,
                            alpha: 1.0,
                            color: '#ffcc00'
                        });
                    }
                }
            }

            // 7. Distance & Multiplier Scoring
            sceneryOffset += bike.speed;
            bike.wheelRotation += bike.speed * 0.1;
            bike.frontWheelRotation += (bike.angle === 0) ? bike.speed * 0.1 : 0.03;

            let isSweetSpot = bike.angle >= currentConfig.sweetSpotMin && bike.angle <= currentConfig.sweetSpotMax;
            let baseCombo = isSweetSpot ? 2 : (bike.angle > 0.15 ? 1.2 : 1);
            let finalCombo = Math.round(baseCombo * trickMultiplier * 10) / 10;

            distance += bike.speed * finalCombo;
            score = Math.floor(distance / 10);

            // Update HUD UI
            document.getElementById('score').innerText = score;
            document.getElementById('speedDisplay').innerText = Math.round(bike.speed * 8);
            document.getElementById('comboDisplay').innerText = finalCombo + 'x';
            document.getElementById('trickDisplay').innerText = activeTrickName;
            document.getElementById('trickDisplay').style.color = activeTrickName === "NONE" ? "#7000ff" : "#00ff66";

            const balanceBar = document.getElementById('balance-bar');
            let balancePct = Math.min(Math.max((bike.angle / currentConfig.crashAngle) * 100, 0), 100);
            balanceBar.style.width = balancePct + '%';
            balanceBar.style.backgroundColor = isSweetSpot ? '#00ff66' : (bike.angle > currentConfig.scrapeAngle ? '#ff0055' : '#00f0ff');

            // 8. Exhaust Smoke Particles
            if (bike.speed > 2) {
                particles.push({
                    x: bike.rearX - 10,
                    y: bike.rearY + bike.wheelRadius - 2,
                    vx: -bike.speed * 0.6 - Math.random(),
                    vy: -Math.random() * 0.8,
                    radius: Math.random() * 4 + 2,
                    alpha: 0.4,
                    color: '#94a3b8'
                });
            }

            // Particle Updates
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.03;
                if (p.alpha <= 0) particles.splice(i, 1);
            }
        }

        function draw() {
            // Sky Background
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Background Parallax Hills
            ctx.fillStyle = '#1e293b';
            for (let i = 0; i < 5; i++) {
                let hillX = (i * 300 - (sceneryOffset * 0.25) % 300);
                ctx.beginPath();
                ctx.arc(hillX + 150, canvas.height - 80, 140, Math.PI, 0, false);
                ctx.fill();
            }

            // Ground Road
            const roadY = bike.rearY + bike.wheelRadius;
            ctx.fillStyle = '#020617';
            ctx.fillRect(0, roadY, canvas.width, canvas.height - roadY);

            // Road Grid Lines
            ctx.fillStyle = '#00f0ff';
            let stripeWidth = 60;
            let stripeGap = 40;
            let offset = sceneryOffset % (stripeWidth + stripeGap);
            for (let x = -offset; x < canvas.width; x += stripeWidth + stripeGap) {
                ctx.fillRect(x, roadY + 14, stripeWidth, 4);
            }

            // Draw Smoke & Spark Particles
            particles.forEach(p => {
                ctx.fillStyle = p.color === '#ffcc00' ? `rgba(255, 204, 0, ${p.alpha})` : `rgba(148, 163, 184, ${p.alpha})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            // --- DRAW MOTORCYCLE & ADVANCED TRICK POSES ---
            ctx.save();
            ctx.translate(bike.rearX, bike.rearY);
            ctx.rotate(-bike.angle); 

            // Swingarm
            ctx.strokeStyle = '#64748b';
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(25, -10);
            ctx.stroke();

            // Main Body Shell
            ctx.fillStyle = currentConfig.color;
            ctx.beginPath();
            ctx.roundRect(12, -35, 42, 20, 6);
            ctx.fill();

            // Seat & Tank
            ctx.fillStyle = currentConfig.accent;
            ctx.fillRect(4, -38, 28, 7);

            // Front Forks & Handlebars
            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(25, -10);
            ctx.lineTo(bike.frameLength - 5, -42);
            ctx.lineTo(bike.frameLength + 5, -2);
            ctx.stroke();

            // --- DYNAMIC RIDER POSES FOR ALL TRICKS ---
            let riderTorsoX = 10, riderTorsoY = -48;
            let riderHeadX = 18, riderHeadY = -58;
            let legEndX = 15, legEndY = -20;
            let armEndX = 55, armEndY = -40;

            if (activeTrickName === "ONE-HANDER") {
                armEndX = -10; armEndY = -65; // Hand high in air
            } else if (activeTrickName === "NO-FOOT") {
                legEndX = -30; legEndY = -55; // Both legs flared backwards
            } else if (activeTrickName === "NAC-NAC") {
                legEndX = -20; legEndY = -10; // Legs whipped out to side
            } else if (activeTrickName === "SUPERMAN!") {
                riderTorsoX = -25; riderTorsoY = -45; // Body stretched straight out horizontal
                riderHeadX = -18; riderHeadY = -55;
                legEndX = -60; legEndY = -45;
            } else if (activeTrickName === "COFFIN LAYBACK") {
                riderTorsoX = -20; riderTorsoY = -35; // Lying flat back on fender
                riderHeadX = -32; riderHeadY = -40;
                legEndX = 25; legEndY = -35;
            } else if (activeTrickName === "HIGH CHAIR") {
                riderTorsoX = 25; riderTorsoY = -50; // Sitting forward on handlebars
                riderHeadX = 30; riderHeadY = -62;
                legEndX = 65; legEndY = -45; // Legs up over handlebars
            }

            // Draw Rider Torso
            ctx.fillStyle = '#1e1b4b';
            ctx.fillRect(riderTorsoX, riderTorsoY, 16, 20);

            // Rider Legs
            ctx.strokeStyle = '#00f0ff';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(riderTorsoX + 8, riderTorsoY + 15);
            ctx.lineTo(legEndX, legEndY);
            ctx.stroke();

            // Rider Arm
            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 3.5;
            ctx.beginPath();
            ctx.moveTo(riderTorsoX + 12, riderTorsoY + 5);
            ctx.lineTo(armEndX, armEndY);
            ctx.stroke();

            // Rider Helmet
            ctx.fillStyle = '#ffaa00';
            ctx.beginPath();
            ctx.arc(riderHeadX, riderHeadY, 10, 0, Math.PI * 2);
            ctx.fill();

            // Helmet Visor
            ctx.fillStyle = '#00f0ff';
            ctx.fillRect(riderHeadX + 3, riderHeadY - 3, 6, 5);

            // Wheels
            drawWheel(0, 0, bike.wheelRadius, bike.wheelRotation); 
            drawWheel(bike.frameLength, 0, bike.wheelRadius, bike.frontWheelRotation); 

            ctx.restore();
        }

        function drawWheel(x, y, radius, rotation) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rotation);

            // Outer Rubber Tire
            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.arc(0, 0, radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 3;
            ctx.stroke();

            // Rim
            ctx.strokeStyle = '#00f0ff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 0, radius - 6, 0, Math.PI * 2);
            ctx.stroke();

            // Spokes
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(-radius + 6, 0); ctx.lineTo(radius - 6, 0);
            ctx.moveTo(0, -radius + 6); ctx.lineTo(0, radius - 6);
            ctx.stroke();

            ctx.restore();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        function gameOver() {
            gameActive = false;
            if (score > highScore) {
                highScore = score;
                document.getElementById('highScore').innerText = highScore;
            }
            document.getElementById('finalScore').innerText = score;
            document.getElementById('game-over').style.display = 'block';
        }

        function restartGame() {
            resetBikeState();
            gameActive = true;
            document.getElementById('game-over').style.display = 'none';
        }

        loop();
    </script>
</body>
</html>
