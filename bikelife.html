<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wheelie Life - Arcade Edition</title>
    <style>
        body {
            margin: 0;
            background: #0f0f1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            user-select: none;
        }

        #game-container {
            text-align: center;
            position: relative;
        }

        #menu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 15, 30, 0.96);
            padding: 35px;
            border: 3px solid #00ffcc;
            border-radius: 14px;
            z-index: 20;
            box-shadow: 0 0 35px rgba(0, 255, 204, 0.4);
            width: 340px;
            text-align: center;
        }

        #menu h1 {
            margin-top: 0;
            color: #00ffcc;
            font-size: 28px;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }

        .option-group {
            margin: 15px 0;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #00ffcc;
            font-size: 14px;
        }

        select {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border-radius: 6px;
            border: 2px solid #00ffcc;
            background: #112233;
            color: #fff;
            cursor: pointer;
        }

        canvas {
            background: linear-gradient(to bottom, #3a86ff, #8ecae6);
            border: 4px solid #00ffcc;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.3);
            display: block;
        }

        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px #000;
            pointer-events: none;
            display: none;
            background: rgba(0,0,0,0.5);
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            text-align: left;
        }

        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 15, 30, 0.96);
            padding: 35px;
            border: 3px solid #ff3366;
            border-radius: 14px;
            display: none;
            box-shadow: 0 0 30px rgba(255, 51, 102, 0.5);
            text-align: center;
            z-index: 15;
        }

        #game-over h2 {
            margin: 0 0 10px 0;
            color: #ff3366;
            font-size: 30px;
        }

        button {
            margin-top: 15px;
            width: 100%;
            padding: 12px;
            font-size: 18px;
            font-weight: bold;
            background: #00ffcc;
            color: #000;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 0 #009977;
        }

        button:hover {
            background: #33ffdd;
        }

        #controls-hint {
            margin-top: 10px;
            font-size: 13px;
            color: #ddd;
            text-shadow: 1px 1px #000;
            display: none;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="menu">
            <h1>WHEELIE LIFE</h1>
            <div class="option-group">
                <label for="bikeSelect">Select Motorcycle:</label>
                <select id="bikeSelect">
                    <option value="scooter">Scooter (Stable & Easy)</option>
                    <option value="dirtbike">Dirt Bike (Balanced Stunt)</option>
                    <option value="sportbike">Sport Bike (Fast & Aggressive)</option>
                </select>
            </div>
            <button id="startBtn">START RIDE</button>
        </div>

        <div id="hud">
            Score: <span id="score">0</span> | Best: <span id="highScore">0</span><br>
            Speed: <span id="speedDisplay">0</span> km/h
        </div>

        <canvas id="gameCanvas" width="850" height="480"></canvas>
        <div id="controls-hint"><strong>A / D or Left / Right:</strong> Lean | <strong>W / Up:</strong> Throttle | <strong>Space / S:</strong> Rear Brake (Saves Flips!)</div>
        
        <div id="game-over">
            <h2>CRASHED!</h2>
            <p>Score: <span id="finalScore">0</span></p>
            <button onclick="restartGame()">TRY AGAIN</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let score = 0;
        let highScore = 0;
        let gameActive = false;
        let distance = 0;
        let sceneryOffset = 0;

        const keys = {};
        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            if (e.code === 'Space') e.preventDefault();
        });
        window.addEventListener('keyup', e => keys[e.code] = false);
        window.addEventListener('blur', () => { for (let k in keys) keys[k] = false; });

        // Bike specs
        const bikeConfigs = {
            scooter: { maxSpeed: 9, accel: 0.08, leanRate: 0.0028, brakePower: 0.014, color: '#ff0055', bodyColor: '#ffffff' },
            dirtbike: { maxSpeed: 11.5, accel: 0.1, leanRate: 0.0035, brakePower: 0.017, color: '#ffaa00', bodyColor: '#222222' },
            sportbike: { maxSpeed: 14.5, accel: 0.12, leanRate: 0.0044, brakePower: 0.020, color: '#00ffcc', bodyColor: '#111111' }
        };

        let currentConfig = bikeConfigs.dirtbike;

        const bike = {
            x: 200,
            angle: 0,
            angularVelocity: 0,
            speed: 5,
            groundY: 370
        };

        let particles = [];

        document.getElementById('startBtn').addEventListener('click', () => {
            const bikeKey = document.getElementById('bikeSelect').value;
            currentConfig = bikeConfigs[bikeKey];
            bike.speed = currentConfig.maxSpeed * 0.5;

            document.getElementById('menu').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            document.getElementById('controls-hint').style.display = 'block';
            gameActive = true;
        });

        function update() {
            if (!gameActive) return;

            // Throttle control (W / Up Arrow)
            if (keys['ArrowUp'] || keys['KeyW']) {
                bike.speed = Math.min(bike.speed + currentConfig.accel, currentConfig.maxSpeed);
            } else {
                bike.speed += ((currentConfig.maxSpeed * 0.55) - bike.speed) * 0.035;
            }

            // Lean controls (A / D or Left / Right)
            if (keys['ArrowLeft'] || keys['KeyA']) {
                bike.angularVelocity -= currentConfig.leanRate; // Lean back
            }
            if (keys['ArrowRight'] || keys['KeyD']) {
                bike.angularVelocity += currentConfig.leanRate; // Lean forward
            }

            // Rear Brake mechanic (Spacebar / S)
            if (keys['Space'] || keys['KeyS']) {
                bike.angularVelocity -= currentConfig.brakePower; // Slams nose down instantly
            }

            // Engine power lifting effect during wheelie
            let throttleEffect = (bike.speed / currentConfig.maxSpeed) * 0.0015;
            bike.angularVelocity += throttleEffect;

            // Physics damping & movement update
            bike.angularVelocity *= 0.96;
            bike.angle += bike.angularVelocity;

            // Clamp ground contact minimum
            if (bike.angle < -0.04) {
                bike.angle = -0.04;
                bike.angularVelocity = 0;
            }

            // Scenery & Scoring calculation
            sceneryOffset += bike.speed;
            distance += Math.round(bike.speed);
            score = Math.floor(distance / 10);
            document.getElementById('score').innerText = score;
            document.getElementById('speedDisplay').innerText = Math.round(bike.speed * 12);

            // Generate smoke / dust particles from rear wheel
            if (bike.speed > 2) {
                particles.push({
                    x: bike.x - 26,
                    y: bike.groundY,
                    vx: -Math.random() * 2 - 1,
                    vy: -Math.random() * 1.5,
                    radius: Math.random() * 4 + 2,
                    alpha: 0.6
                });
            }

            // Update Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].x += particles[i].vx;
                particles[i].y += particles[i].vy;
                particles[i].alpha -= 0.03;
                if (particles[i].alpha <= 0) particles.splice(i, 1);
            }

            // Crash condition: Looping out backward (> 1.3 radians)
            if (bike.angle > 1.3) {
                gameOver();
            }
        }

        function draw() {
            // Sky gradient background
            ctx.fillStyle = '#3a86ff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Parallax Background Hills
            ctx.fillStyle = '#2b6cb0';
            for (let i = 0; i < 6; i++) {
                let hillX = (i * 350 - (sceneryOffset * 0.3) % 350);
                ctx.beginPath();
                ctx.arc(hillX + 175, canvas.height - 110, 150, Math.PI, 0, false);
                ctx.fill();
            }

            // Ground Road
            ctx.fillStyle = '#1e1e2f';
            ctx.fillRect(0, bike.groundY, canvas.width, canvas.height - bike.groundY);

            // Road Stripes
            ctx.fillStyle = '#00ffcc';
            let stripeWidth = 55;
            let stripeGap = 45;
            let offset = sceneryOffset % (stripeWidth + stripeGap);
            for (let x = -offset; x < canvas.width; x += stripeWidth + stripeGap) {
                ctx.fillRect(x, bike.groundY + 16, stripeWidth, 5);
            }

            // Draw Dust Particles
            particles.forEach(p => {
                ctx.fillStyle = `rgba(200, 200, 220, ${p.alpha})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw Motorcycle
            ctx.save();
            ctx.translate(bike.x, bike.groundY);
            ctx.rotate(bike.angle);

            // Bike Main Frame / Body
            ctx.fillStyle = currentConfig.color;
            ctx.fillRect(-32, -40, 66, 26);

            // Seat & Tank Details
            ctx.fillStyle = currentConfig.bodyColor;
            ctx.fillRect(-22, -48, 36, 10);

            // Rider Helmet
            ctx.fillStyle = '#ffff00';
            ctx.beginPath();
            ctx.arc(-4, -64, 11, 0, Math.PI * 2);
            ctx.fill();

            // Rider Torso
            ctx.fillStyle = '#2b2d42';
            ctx.fillRect(-13, -54, 19, 23);

            // Handlebars & Front Fork
            ctx.strokeStyle = '#e2e8f0';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(26, -30);
            ctx.lineTo(38, -48);
            ctx.stroke();

            // Wheels
            drawWheel(-28, 0);
            drawWheel(34, 0);

            ctx.restore();
        }

        function drawWheel(x, y) {
            ctx.fillStyle = '#111';
            ctx.beginPath();
            ctx.arc(x, y, 18, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#a0aec0';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(x, y, 9, 0, Math.PI * 2);
            ctx.stroke();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        function gameOver() {
            gameActive = false;
            if (score > highScore) {
                highScore = score;
                document.getElementById('highScore').innerText = highScore;
            }
            document.getElementById('finalScore').innerText = score;
            document.getElementById('game-over').style.display = 'block';
        }

        function restartGame() {
            score = 0;
            distance = 0;
            sceneryOffset = 0;
            bike.angle = 0;
            bike.angularVelocity = 0;
            bike.speed = currentConfig.maxSpeed * 0.5;
            particles = [];
            gameActive = true;
            document.getElementById('game-over').style.display = 'none';
        }

        loop();
    </script>
</body>
</html>
