<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPS TEST // MOUSE CLICK SPEED</title>
    <style>
        :root {
            --bg-dark: #080b10;
            --bg-card: #121721;
            --accent-cyan: #00f0ff;
            --accent-red: #ff2a5f;
            --accent-yellow: #ffb703;
            --text-main: #f0f6fc;
            --border-color: #232b38;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 40px;
            border-radius: 20px;
            width: 90%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
            text-align: center;
        }

        h1 {
            font-size: 1.8rem;
            color: var(--accent-cyan);
        }

        .stats-grid {
            display: flex;
            justify-content: space-around;
            width: 100%;
            gap: 15px;
        }

        .stat-box {
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            padding: 12px 20px;
            border-radius: 12px;
            flex: 1;
            font-weight: 700;
            font-size: 0.95rem;
            color: #8b949e;
        }

        .stat-box span {
            display: block;
            font-size: 1.4rem;
            color: var(--accent-cyan);
            margin-top: 4px;
        }

        .stat-box.highlight span {
            color: var(--accent-yellow);
        }

        #clickBox {
            width: 100%;
            height: 180px;
            background: linear-gradient(135deg, #1f2937, #111827);
            border: 2px dashed var(--accent-cyan);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.1s ease;
            box-shadow: inset 0 0 20px rgba(0, 240, 255, 0.05);
        }

        #clickBox:active {
            transform: scale(0.98);
            background: linear-gradient(135deg, #111827, #1f2937);
            border-color: var(--accent-yellow);
        }

        #clickBox h2 {
            font-size: 2rem;
            color: var(--text-main);
            pointer-events: none;
        }

        #clickBox p {
            font-size: 0.9rem;
            color: #8b949e;
            margin-top: 5px;
            pointer-events: none;
        }

        .btn-reset {
            background: var(--accent-cyan);
            color: #000;
            border: none;
            padding: 12px 24px;
            font-weight: 800;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            width: 100%;
            transition: opacity 0.2s;
        }

        .btn-reset:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>CPS TEST</h1>
        <p style="color: #8b949e; font-size: 0.9rem;">Test how fast you can click your mouse in 5 seconds!</p>

        <div class="stats-grid">
            <div class="stat-box">
                Time Left
                <span id="timerDisplay">5.0s</span>
            </div>
            <div class="stat-box highlight">
                Clicks
                <span id="clickCount">0</span>
            </div>
        </div>

        <div id="clickBox" onclick="handleClick()">
            <h2 id="boxText">CLICK HERE TO START</h2>
            <p>Timer begins on your first click</p>
        </div>

        <button class="btn-reset" onclick="resetTest()">Reset Test</button>
    </div>

    <nav><a href="supersmash.html">Platform fighters</a></nav>

    <script>
        let clicks = 0;
        let timeLeft = 5.0;
        let timerInterval = null;
        let isPlaying = false;
        let isFinished = false;

        const timerDisplay = document.getElementById('timerDisplay');
        const clickCountDisplay = document.getElementById('clickCount');
        const boxText = document.getElementById('boxText');
        const clickBox = document.getElementById('clickBox');

        function handleClick() {
            if (isFinished) return;

            if (!isPlaying) {
                isPlaying = true;
                boxText.textContent = "CLICK FAST!";
                clickBox.style.borderColor = "var(--accent-yellow)";
                
                timerInterval = setInterval(() => {
                    timeLeft -= 0.1;
                    timerDisplay.textContent = timeLeft.toFixed(1) + 's';

                    if (timeLeft <= 0) {
                        endTest();
                    }
                }, 100);
            }

            clicks++;
            clickCountDisplay.textContent = clicks;
        }

        function endTest() {
            clearInterval(timerInterval);
            isPlaying = false;
            isFinished = true;
            timeLeft = 0.0;
            timerDisplay.textContent = "0.0s";

            const cps = (clicks / 5).toFixed(2);
            boxText.innerHTML = `Done! <br><span style="font-size: 1.3rem; color: var(--accent-cyan);">${cps} CPS</span>`;
            clickBox.style.borderColor = "var(--accent-cyan)";
        }

        function resetTest() {
            clearInterval(timerInterval);
            clicks = 0;
            timeLeft = 5.0;
            isPlaying = false;
            isFinished = false;

            timerDisplay.textContent = "5.0s";
            clickCountDisplay.textContent = "0";
            boxText.textContent = "CLICK HERE TO START";
            clickBox.style.borderColor = "var(--accent-cyan)";
        }
    </script>
</body>
</html>
