<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic Pong Game</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        h1 {
            margin-bottom: 10px;
        }

        canvas {
            border: 4px solid #fff;
            background-color: #000;
        }

        .controls {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <h1>PONG</h1>
    <canvas id="pongCanvas" width="800" height="500"></canvas>
    <div class="controls">
        <strong>Controls:</strong> Left Paddle: <code>W</code> (Up) / <code>S</code> (Down) | Right Paddle: <code>Up Arrow</code> / <code>Down Arrow</code>
    </div>

    <script>
        const canvas = document.getElementById("pongCanvas");
        const ctx = canvas.getContext("2d");

        // Game Configuration
        const PADDLE_WIDTH = 12;
        const PADDLE_HEIGHT = 90;
        const BALL_SIZE = 12;
        const PADDLE_SPEED = 7;

        // Player 1 (Left)
        const player1 = {
            x: 20,
            y: canvas.height / 2 - PADDLE_HEIGHT / 2,
            score: 0,
            dy: 0
        };

        // Player 2 (Right)
        const player2 = {
            x: canvas.width - 20 - PADDLE_WIDTH,
            y: canvas.height / 2 - PADDLE_HEIGHT / 2,
            score: 0,
            dy: 0
        };

        // Ball
        const ball = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            speedX: 5,
            speedY: 5
        };

        // Key states
        const keys = {};

        document.addEventListener("keydown", (e) => {
            keys[e.key] = true;
        });

        document.addEventListener("keyup", (e) => {
            keys[e.key] = false;
        });

        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            // Reverse direction towards the scoring player and randomize Y trajectory
            ball.speedX = -ball.speedX;
            ball.speedY = (Math.random() > 0.5 ? 1 : -1) * (3 + Math.random() * 3);
        }

        function update() {
            // Player 1 Movement (W / S)
            if (keys["w"] || keys["W"]) {
                player1.y -= PADDLE_SPEED;
            }
            if (keys["s"] || keys["S"]) {
                player1.y += PADDLE_SPEED;
            }

            // Player 2 Movement (Up / Down Arrows)
            if (keys["ArrowUp"]) {
                player2.y -= PADDLE_SPEED;
            }
            if (keys["ArrowDown"]) {
                player2.y += PADDLE_SPEED;
            }

            // Keep paddles inside canvas boundaries
            player1.y = Math.max(0, Math.min(canvas.height - PADDLE_HEIGHT, player1.y));
            player2.y = Math.max(0, Math.min(canvas.height - PADDLE_HEIGHT, player2.y));

            // Move ball
            ball.x += ball.speedX;
            ball.y += ball.speedY;

            // Top and bottom border collisions
            if (ball.y <= 0 || ball.y + BALL_SIZE >= canvas.height) {
                ball.speedY = -ball.speedY;
            }

            // Left paddle collision
            if (
                ball.x <= player1.x + PADDLE_WIDTH &&
                ball.x >= player1.x &&
                ball.y + BALL_SIZE >= player1.y &&
                ball.y <= player1.y + PADDLE_HEIGHT
            ) {
                ball.speedX = Math.abs(ball.speedX) + 0.2; // Slightly increase speed on hit
                ball.x = player1.x + PADDLE_WIDTH; // Prevent sticking
            }

            // Right paddle collision
            if (
                ball.x + BALL_SIZE >= player2.x &&
                ball.x + BALL_SIZE <= player2.x + PADDLE_WIDTH &&
                ball.y + BALL_SIZE >= player2.y &&
                ball.y <= player2.y + PADDLE_HEIGHT
            ) {
                ball.speedX = -(Math.abs(ball.speedX) + 0.2); // Slightly increase speed on hit
                ball.x = player2.x - BALL_SIZE; // Prevent sticking
            }

            // Score conditions
            if (ball.x < 0) {
                player2.score++;
                resetBall();
            } else if (ball.x > canvas.width) {
                player1.score++;
                resetBall();
            }
        }

        function draw() {
            // Clear canvas
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw center dashed line
            ctx.strokeStyle = "#fff";
            ctx.setLineDash([10, 10]);
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]); // Reset line dash

            // Draw paddles
            ctx.fillStyle = "#fff";
            ctx.fillRect(player1.x, player1.y, PADDLE_WIDTH, PADDLE_HEIGHT);
            ctx.fillRect(player2.x, player2.y, PADDLE_WIDTH, PADDLE_HEIGHT);

            // Draw ball
            ctx.fillRect(ball.x, ball.y, BALL_SIZE, BALL_SIZE);

            // Draw scores
            ctx.font = "36px 'Courier New', Courier, monospace";
            ctx.fillText(player1.score, canvas.width / 4, 50);
            ctx.fillText(player2.score, (3 * canvas.width) / 4, 50);
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Start the game
        gameLoop();
    </script>
</body>
</html>
